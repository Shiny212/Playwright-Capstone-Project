
name: Playwright Tests

on:
 push:
   branches:[main]

jobs:

 test:

  runs-on:
   ubuntu-latest

  steps:

  - uses:
      actions/checkout@v4

  - uses:
      actions/setup-node@v4

    with:
      node-version:lts/*

  - run:
      npm install

  - run:
      npx playwright install --with-deps

  - run:
      npx playwright test

  - run:
      npx allure generate allure-results --clean -o allure-report
