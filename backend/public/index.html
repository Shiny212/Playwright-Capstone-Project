<!DOCTYPE html>
<html>
<head>
<title>SmartShop</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<h1>SmartShop</h1>

<section>

<h2>Login</h2>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button
id="loginBtn">

Login

</button>

<p id="loginMsg"></p>

</section>

<hr>

<section>

<h2>Products</h2>

<div id="products">

</div>

</section>

<hr>

<section>

<h2>Cart</h2>

<div id="cart">

</div>

</section>
<hr>

<section>
    <h2>Checkout</h2>

    <input id="address" placeholder="Enter Address">

    <select id="paymentMode">
        <option value="">Select Payment</option>
        <option value="COD">Cash on Delivery</option>
        <option value="UPI">UPI</option>
    </select>

    <button id="checkoutBtn">Checkout</button>

    <p id="checkoutMsg"></p>
</section>
<hr>

<section>
    <h2>User Profile</h2>

    <input id="profileName" placeholder="Name">
    <input id="profileAddress" placeholder="Address">

    <button id="profileBtn">Update Profile</button>

    <p id="profileMsg"></p>
</section>

<hr>

<section>
    <h2>Customer Support</h2>

    <input id="issue" placeholder="Enter issue">

    <button id="supportBtn">Create Ticket</button>

    <p id="supportMsg"></p>
</section>

<script
src="script.js">

</script>

</body>
</html>
